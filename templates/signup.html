{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="subtitle">Sign up to start booking flights</p>
        
        <div id="alert" class="alert" style="display:none;"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required 
                       placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required 
                       placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required 
                       placeholder="Enter your phone number">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Create a password" minlength="6">
                <small style="color: #666; margin-top: 5px; display: block;">Minimum 6 characters</small>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required 
                       placeholder="Re-enter your password">
            </div>
            
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="/ui/login">Login Here</a></p>
        </div>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.auth-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    padding: 40px;
    width: 100%;
    max-width: 450px;
}

.auth-card h2 {
    margin: 0 0 10px 0;
    color: #1a1a1a;
    font-size: 28px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
    font-size: 14px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 500;
    font-size: 14px;
}

.form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.3s;
    font-family: inherit;
}

.form-group input:focus {
    outline: none;
    border-color: #2f6fec;
    box-shadow: 0 0 0 3px rgba(47, 111, 236, 0.1);
}

.btn-primary {
    width: 100%;
    padding: 14px;
    background: #2f6fec;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
}

.btn-primary:hover {
    background: #1e5dd8;
}

.btn-primary:active {
    transform: scale(0.98);
}

.alert {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
}

.alert.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.alert.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}

.auth-footer {
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    font-size: 14px;
}

.auth-footer a {
    color: #2f6fec;
    text-decoration: none;
    font-weight: 600;
}

.auth-footer a:hover {
    text-decoration: underline;
}

small {
    font-size: 12px !important;
}
</style>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const alertBox = document.getElementById('alert');
    
    if (!fullname || !email || !phone || !password || !confirmPassword) {
        alertBox.className = 'alert error';
        alertBox.textContent = 'Please fill in all fields';
        alertBox.style.display = 'block';
        return;
    }
    
    if (password !== confirmPassword) {
        alertBox.className = 'alert error';
        alertBox.textContent = 'Passwords do not match!';
        alertBox.style.display = 'block';
        return;
    }
    
    if (password.length < 6) {
        alertBox.className = 'alert error';
        alertBox.textContent = 'Password must be at least 6 characters';
        alertBox.style.display = 'block';
        return;
    }
    
    try {
        const response = await fetch('/auth/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                full_name: fullname,
                email: email,
                phone_number: phone,
                password: password
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            alertBox.className = 'alert success';
            alertBox.textContent = '✓ Account created! Redirecting to login...';
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = '/ui/login';
            }, 2000);
        } else {
            alertBox.className = 'alert error';
            alertBox.textContent = data.error || 'Signup failed';
            alertBox.style.display = 'block';
        }
    } catch (error) {
        console.error('Error:', error);
        alertBox.className = 'alert error';
        alertBox.textContent = 'An error occurred. Please try again.';
        alertBox.style.display = 'block';
    }
});
</script>
{% endblock %}
